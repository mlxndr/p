name: Slides PDFs

# Exports each deck (one folder down, icame47/, or two, 1a/7/) to
# <deck>/slides.pdf: one full-size (1920x1080) page
# per slide, fragments shown, in the deck's own default theme and layout
# (or its "pdfTheme", which head.js uses whenever fragments=false), spare
# slides at the end. Also <deck>/slides-handout.pdf: the student version
# (no @slide nohandout or spare slides, answers blanked), two slides to
# an A4 page, framed and numbered (scripts/handout-nup.py), for Moodle.
#
# - On push to main: rebuilds only the decks whose content, metadata or
#   images changed in that push.
# - Run by hand (Actions tab > Slides PDFs > Run workflow): rebuilds every
#   deck; use this after changing anything in inc/ (themes, layouts).

on:
  push:
    branches: [main]
    paths:
      - '*/content.md'
      - '*/title.md'
      - '*/meta.json'
      - '*/img/**'
      - '*/*/content.md'
      - '*/*/title.md'
      - '*/*/meta.json'
      - '*/*/img/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slides-pdf
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install DeckTape (uses the runner's own Chrome)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install -g decktape@3

      - name: Set up Python (for the handouts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pypdf and reportlab
        run: pip install pypdf reportlab

      - name: Work out which decks to export
        id: decks
        run: |
          is_deck() { case "$1" in archive/*|_to_delete/*|.*) return 1;; esac; [ -f "$1/index.html" ] && [ -f "$1/content.md" ] && [ "$1" != "specimen" ]; }
          # a deck is one folder down (icame47) or two (1a/7)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            candidates=$(ls -d */ */*/ 2>/dev/null | sed 's|/$||')
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            candidates=$( (echo "$changed" | cut -d/ -f1; echo "$changed" | grep '/.*/' | cut -d/ -f1-2) | sort -u)
          fi
          decks=""
          for d in $candidates; do is_deck "$d" && decks="$decks $d"; done
          echo "list=$decks" >> "$GITHUB_OUTPUT"
          echo "Decks to export:$decks"

      - name: Serve the site locally
        if: steps.decks.outputs.list != ''
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2

      - name: Export PDFs
        if: steps.decks.outputs.list != ''
        run: |
          for d in ${{ steps.decks.outputs.list }}; do
            echo "::group::$d"
            decktape reveal \
              --size 1920x1080 \
              --load-pause 4000 \
              --pause 800 \
              --chrome-path "$(which google-chrome)" \
              --chrome-arg=--no-sandbox \
              "http://localhost:8000/$d/?fragments=false" \
              "$d/slides.pdf"
            decktape reveal \
              --size 1920x1080 \
              --load-pause 4000 \
              --pause 800 \
              --chrome-path "$(which google-chrome)" \
              --chrome-arg=--no-sandbox \
              "http://localhost:8000/$d/?fragments=false&student=1&spares=0" \
              "$RUNNER_TEMP/${d//\//_}-student.pdf"
            python3 scripts/handout-nup.py "$RUNNER_TEMP/${d//\//_}-student.pdf" "$d/slides-handout.pdf" 2
            echo "::endgroup::"
          done

      - name: Commit the PDFs
        if: steps.decks.outputs.list != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*slides.pdf' '*slides-handout.pdf'
          if git diff --staged --quiet; then
            echo "No PDFs changed"
          else
            git commit -m "Update slides PDFs and handouts"
            git pull --rebase
            git push
          fi
