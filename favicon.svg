<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    path, circle {
      stroke: #2D3748;
      fill: none;
    }
    circle {
      fill: #2D3748;
    }
    @media (prefers-color-scheme: dark) {
      path, circle {
        stroke: #E2E8F0;
      }
      circle {
        fill: #E2E8F0;
      }
    }
  </style>
  <!-- Logo shape -->
  <path d="M10 70 L25 30 L40 70 L55 30 L70 70" 
        stroke-width="6" 
        stroke-linecap="round"
        stroke-linejoin="round"/>
  
  <!-- Dot for .is -->
  <circle cx="80" cy="35" r="5"/>
</svg>
