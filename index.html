<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentations | mga.is</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="inc/css/fonts.css">
    <link rel="stylesheet" href="inc/css/index.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="mga.is" />
    <link rel="manifest" href="/site.webmanifest" />
</head>
<body style="background-color: #F2F2EA;" class="min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-12 text-center">
            <img src="img/mga.png" alt="mga.is" class="w-24 h-24 mx-auto mb-4">
        </header>

        <section class="mb-12">
            <h2 class="text-2xl font-bold text-gray-800 mb-4" style="font-weight: 200;">Presentations</h2>
            <div id="presentations-list" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
        </section>

        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-4" style="font-weight: 200;">Shiny applications</h2>
            <div id="shiny-apps-list" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            <!-- Presentations will be listed here -->
            </div>
        </section>
        <br><br>
        <section>
            <h2 class="text-2xl font-bold text-gray-800 mb-4" style="font-weight: 200;"><a href="./gamma/">Click here for Gamma and other presentations</a></h2>
        </section>
    </div>

    <script>
        async function fetchDirectories() {
            try {
                const response = await fetch('https://api.github.com/repos/mlxndr/p/contents/');
                const data = await response.json();
                
                const excludedFolders = ['img', 'gamma', 'inc', 'f', 'css', 'archive'];
                const directories = data.filter(item => 
                    item.type === 'dir' && !excludedFolders.includes(item.name.toLowerCase()));
                const presentationsList = document.getElementById('presentations-list');
                
                directories.forEach(dir => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-200';
                    
                    card.innerHTML = `
                        <h2 class="text-xl font-semibold text-gray-800 mb-2" style="font-weight: 200; font-variant-caps: all-small-caps;">${formatTitle(dir.name)}</h2>
                        <a href="/${dir.name}" 
                           class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors duration-200">
                            View Presentation
                        </a>
                    `;
                    
                    presentationsList.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching directories:', error);
                document.getElementById('presentations-list').innerHTML = `
                    <div class="col-span-full text-center text-red-600">
                        Unable to load presentations. Please try again later.
                    </div>
                `;
            }
        }

        function formatTitle(dirName) {
            return dirName
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Define your Shiny apps
        const shinyApps = [
            {
                name: 'Uncivil',
                description: 'Browsing data for Alexander and Struan, uncivilized in the history of English',
                url: 'https://mlxndr.shinyapps.io/Uncivil'
            },
            {
                name: 'Scaffold: Text Frequency',
                description: 'Browsing data for scaffolding concepts sample text frequency viewer',
                url: 'https://mlxndr.shinyapps.io/ScaffoldTextSample'
            },
            {
                name: 'Scaffold: Text Viewer',
                description: 'Browsing data for scaffolding concepts sample texts',
                url: 'https://mlxndr.shinyapps.io/ScaffoldTextView'
            },
            {
                name: 'Assisted Dying: 2021 and 2024 Consultation Corpus',
                description: 'Corpus of the 2021 and 2024 consultations on assisted dying in Scotland',
                url: 'https://mlxndr.shinyapps.io/adcorp/'
            },
            {
                name: 'Assisted Dying: 2021 and 2024 Consultation Topic Models',
                description: 'Topic models of the 2021 and 2024 consultations on assisted dying in Scotland',
                url: 'https://mlxndr.shinyapps.io/adtopic/'
            },
            {
                name: 'Assisted Dying: 2021 and 2024 Press Corpus',
                description: 'Corpus of the UK press articles on assisted dying published at the same time as the 2021 and 2024 consultations',
                url: 'https://mlxndr.shinyapps.io/adpress/'
            },
            {
                name: 'Assisted Dying: 2021 and 2024 Consultation Overlap and Templates Analysis',
                description: 'Overlap and template analysis dashboard of the 2021 and 2024 consultations on assisted dying in Scotland',
                url: 'https://mlxndr.shinyapps.io/adoppover/'
            },
            // Add more apps as needed
        ];

        function displayShinyApps() {
            const shinyAppsList = document.getElementById('shiny-apps-list');
            
            shinyApps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition-shadow duration-200';
                
                card.innerHTML = `
                    <h2 class="text-xl font-semibold text-gray-800 mb-2" style="font-weight: 200; font-variant-caps: all-small-caps;">${app.name}</h2>
                    <p class="text-gray-600 mb-4">${app.description}</p>
                    <a href="${app.url}" 
                       target="_blank"
                       class="inline-block bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition-colors duration-200">
                        Launch App
                    </a>
                `;
                
                shinyAppsList.appendChild(card);
            });
        }

        // Fetch directories and display Shiny apps when the page loads
        fetchDirectories();
        displayShinyApps();
    </script>
</body>
</html>
