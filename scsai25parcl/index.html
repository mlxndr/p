<!doctype html>
<html lang="en">
<head>
    <title>SCS - Some AI updates</title>
    <script>
        fetch('../inc/pres-head.html')
            .then(response => response.text())
            .then(html => {
                       document.head.insertAdjacentHTML('afterbegin', html);
                   });
    </script>
    <link rel="stylesheet" href="../inc/css/th-d-bg-underlit.css" id="theme">
</head>
<body>
    <div class="reveal">
        <div class="slides"  style="height:100%;width:100%;">
            <!-- Title slide - Using HTML for complex formatting -->
            <section>
                <br><br><br><br><br>
                <h1 class="pres-title">Some AI updates</h1>
                <div class="titlebr">
                    SCS School Collective<br><span class="subtle">March 2025<br>Marc Alexander</span>
            </section>
            
            <!-- Content slides -->
            <section data-markdown="./content.md" data-separator="^\n---\n" data-separator-vertical="^\n--\n" data-separator-notes="^notes:" data-charset="utf-8"></section>
        </div>
    </div>    

    <script src="../inc/reveal.js/dist/reveal.js"></script>
    <script src="../inc/reveal.js/plugin/reveal.js-menu/menu.js"></script>
    <script src="../inc/reveal.js/plugin/markdown/markdown.js"></script>
    <script src="../inc/reveal.js/plugin/notes/notes.js"></script>
    <script src="../inc/reveal.js/plugin/pdfexport/pdfexport.js"></script>
    <script src="../inc/reveal.js/plugin/appearance/appearance.js"></script>
    <script src="../inc/reveal.js/plugin/onetimer/onetimer.js"></script>
    <script src="../inc/revconfig.js"></script>
    <script>
        Reveal.initialize({
        parallaxBackgroundImage: '../inc/css/bg/d-colours-par.jpg',
        parallaxBackgroundSize: '2865px 1080px', // CSS syntax, e.g. "2100px 900px" - currently only pixels are supported (don't use % or auto)
        });
    </script>
</body>
</html>
